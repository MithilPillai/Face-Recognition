<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Photos</title>
    <link rel="stylesheet" href="home.css" />
    <style>
      body {
        background-color: #f4f4f4;
        font-family: "Nunito", sans-serif;
        color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 20px;
      }
      #eventName {
        font-weight: bold;
      }

      .main-content {
        width: 100%;
        max-width: 1200px;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .headerTitle {
        font-size: 2rem;
        margin-bottom: 20px;
        text-align: center;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 15px;
        padding: 20px;
      }

      .photo-container {
        position: relative;
        width: 100%;
        padding-top: 75%;
        /* 4:3 Aspect Ratio */
        overflow: hidden;
        border: 2px solid black;
        border-radius: 10px;
        transition: transform 0.3s ease;
      }

      .photo-container:hover {
        transform: scale(1.05);
      }

      .photo {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 5px;
      }

      .scan-button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: black;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        display: block;
        margin: 20px auto;
      }

      .scan-button:hover {
        background-color: black;
      }

      #video {
        display: none;
        width: 100%;
        max-width: 720px;
        margin: 20px auto;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.9);
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        margin: auto;
        display: block;
        position: relative;
        /* Added for absolute positioning of download button */
        width: 80%;
        max-width: 700px;
        padding-top: 50px;
        /* Ensure space for the download button */
      }

      .close {
        position: absolute;
        top: 15px;
        right: 35px;
        color: #f1f1f1;
        font-size: 40px;
        font-weight: bold;
        transition: 0.3s;
      }

      .close:hover,
      .close:focus {
        color: #bbb;
        text-decoration: none;
        cursor: pointer;
      }

      .user-container {
        margin: 20px 0;
      }

      .download-button {
        position: absolute;
        top: 10px;
        left: 10px;
        /* Move to the left side */
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        /* Smaller size */
        height: 30px;
        /* Smaller size */
        background-color: #fff;
        /* White background */
        color: #000;
        /* Black icon */
        border: none;
        /* Remove default border */
        border-radius: 50%;
        /* Rounded button */
        cursor: pointer;
        /* Pointer cursor on hover */
        transition: background-color 0.3s ease-in-out, transform 0.3s;
        /* Smooth transitions */
        text-decoration: none;
        /* Remove underline */
        z-index: 10;
        /* Ensure it's above other content */
      }

      .download-button:hover {
        background-color: #ccc;
        /* Slightly darker white on hover */
        transform: translateY(-2px);
        /* Slight lift on hover */
      }

      .download-button svg {
        stroke: #000;
        /* Black stroke for the icon */
        width: 16px;
        /* Smaller icon size */
        height: 16px;
        /* Smaller icon size */
      }

      /* Specific styling for the username modal */
      #usernameModal .modal-content {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        width: 50%;
        max-width: 600px;
        margin: 15% auto;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      #usernameModal input {
        width: 80%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      #usernameModal button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background: #3c00a0;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
      }

      #usernameModal button:hover {
        background-color: #555;
      }
    </style>
  </head>

  <body>
    <div class="main-content">
      <!-- Username Modal -->
      <div id="usernameModal" class="modal">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h2>Enter Your Username</h2>
          <input type="text" id="usernameInput" placeholder="Username" />
          <button id="submitUsername">Submit</button>
        </div>
      </div>

      <div class="header">
        <!-- <h2 class="headerTitle" id="pageTitle">Event Photos</h2> -->
      </div>
      <!-- Add this within the .main-content div -->
      <!-- <button id="copySortedLinkBtn" class="btn-secondary">Copy Link</button> -->
      <!-- Add this within the .main-content div -->
      <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <div class="modal-content">
          <a id="downloadBtn" href="" download="" class="download-button">
            <svg
              class="feather feather-download"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </a>
          <img id="modalImage" src="" alt="Image" />
        </div>
      </div>

      <div id="eventDetails">
        <h1 id="eventName"></h1>
        <button id="scanButton" class="scan-button">Scan Your Face</button>

        <video id="video" autoplay muted></video>
        <div id="photoGallery" class="gallery"></div>
      </div>
      <div id="userImages"></div>
    </div>

    <!-- Username Modal
    <div id="usernameModal" class="modal">
      <div class="modal-content">
        <h2>Enter Your Username</h2>
        <input type="text" id="usernameInput" placeholder="Username" />
        <button id="submitUsername">Submit</button>
      </div>
    </div> -->

    <!-- The Modal -->
    <div id="myModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <a id="downloadBtn" href="" download class="download-button">⬇</a>
        <img id="modalImage" src="" alt="Image" />
      </div>
    </div>

    <script src="clientImages.js"></script>
  </body>
</html>
